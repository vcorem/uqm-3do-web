name: Deploy to Cloudflare

# Four published engines: Original and HD, each in C (/original/, /hd/) and in the
# Rust port (/original-rust/, /hd-rust/), and the separate game Cosmo Clash
# (/cosmoclash/). The two Rust engines build in parallel jobs; the deploy job
# builds and tests Cosmo Clash, builds the C engines, adds the Rust builds, tests
# C against Rust in real two-browser matches and deploys.
on:
  push:
    branches: [deploy/cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  rust-engine:
    strategy:
      matrix:
        edition: [original, hd]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-emscripten
          rustup toolchain install "$(cat .rust-wasm-toolchain)" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Restore the Rust engine build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            .tools/rust-engine-${{ matrix.edition }}
          key: rust-engine-${{ matrix.edition }}-${{ hashFiles('.rust-wasm-toolchain', format('rust/uqm-engine-{0}/**', matrix.edition), 'rust/uqm-core/**', 'rust/uqm-png/**', 'rust/uqm-lua/**', 'scripts/rust-engine/**') }}
          restore-keys: rust-engine-${{ matrix.edition }}-
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Build the ${{ matrix.edition }} Rust engine
        env:
          JOBS: '4'
          UQM_CORE: rust
        run: |
          if [ "${{ matrix.edition }}" = hd ]; then
            HD_BUILD_OUTPUT="$PWD/.tools/out" BUILD_OUTPUT="$PWD/.tools/out" ./scripts/build-hd-web.sh
          else
            BUILD_OUTPUT="$PWD/.tools/out" ./scripts/build-web.sh
          fi
          # The data file is the same as the C build's; only its hash travels to the deploy job.
          sha256sum .tools/out/uqm-debug.data | cut -d' ' -f1 > .tools/out/uqm-debug.data.sha256
          rm .tools/out/uqm-debug.data
          cat .tools/out/engine-language.json
          ls -la .tools/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-${{ matrix.edition }}
          path: .tools/out
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: rust-engine
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cosmoclash/package-lock.json
      - name: Install locked Node dependencies
        run: |
          npm ci
          npm ci --prefix cosmoclash
      - name: Install the pinned Rust toolchain (relay tests, Cosmo Clash gameplay Wasm)
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - name: Test browser helpers and real WebSocket relays
        run: npm test
      - name: Test the Cloudflare relay and site under wrangler dev
        timeout-minutes: 12
        run: npm run test:worker
      # Before the long engine builds: a Cosmo Clash build that cannot work at /cosmoclash/ stops here.
      - name: Build Cosmo Clash for /cosmoclash/ and compare its Rust gameplay and Wasm
        run: |
          npm test --prefix cosmoclash
          npm run build --prefix cosmoclash -- --base /cosmoclash/
          node cosmoclash/tests/wasm.mjs
          python3 scripts/package-editions.py --check-cosmoclash cosmoclash/dist
          sha256sum cosmoclash/dist/cosmoclash.wasm
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Build the Original and HD C engines
        env:
          JOBS: '4'
          UQM_CORE: c
        run: |
          BUILD_OUTPUT="$PWD/.tools/original-dist" ./scripts/build-web.sh
          HD_BUILD_OUTPUT="$PWD/.tools/hd-dist" BUILD_OUTPUT="$PWD/.tools/hd-dist" ./scripts/build-hd-web.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-original
          path: .tools/original-rust-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-hd
          path: .tools/hd-rust-dist
      - name: Add the shared data files to the Rust builds
        run: |
          for edition in original hd; do
            expected="$(cat .tools/$edition-rust-dist/uqm-debug.data.sha256)"
            actual="$(sha256sum .tools/$edition-dist/uqm-debug.data | cut -d' ' -f1)"
            echo "$edition data: C $actual, Rust $expected"
            test "$actual" = "$expected"
            cp .tools/$edition-dist/uqm-debug.data .tools/$edition-rust-dist/uqm-debug.data
            rm .tools/$edition-rust-dist/uqm-debug.data.sha256
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['core']=='c', d" .tools/$edition-dist/engine-language.json
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['core']=='rust' and d['game_engine']=='rust', d" .tools/$edition-rust-dist/engine-language.json
          done
          sha256sum .tools/*-dist/uqm-debug.wasm
      - name: Package the four engines and Cosmo Clash behind the picker
        run: |
          python3 scripts/package-editions.py --original .tools/original-dist --hd .tools/hd-dist \
            --original-rust .tools/original-rust-dist --hd-rust .tools/hd-rust-dist \
            --cosmoclash cosmoclash/dist --output .tools/release-web
      - name: Run actual-source Wasm transport and disconnect regressions
        run: bash sc2/src/uqm/supermelee/netplay/tests/run.sh
      - name: Test the edition picker with the real engines
        run: |
          npx playwright install --with-deps chromium
          UQM_DIST=.tools/release-web npm run test:editions
      - name: Test the Cosmo Clash card, a battle and Online Melee on the packaged site (Node relay)
        run: UQM_DIST=.tools/release-web UQM_TEST_OUTPUT=test-results/cosmoclash-site npm run test:cosmoclash-site
      - name: Test the room-list client in a real browser
        run: UQM_BROWSERS=chromium npm run test:lobby-client
      - name: Test Original C against Original Rust in real two-browser matches
        run: UQM_DIST=.tools/original-dist UQM_PEER_DIST=.tools/original-rust-dist UQM_TEST_OUTPUT=test-results/original-c-rust npm run test:browser
      - name: Test HD C against HD Rust in real two-browser matches
        run: UQM_EDITION=hd UQM_DIST=.tools/hd-dist UQM_PEER_DIST=.tools/hd-rust-dist UQM_TEST_OUTPUT=test-results/hd-c-rust npm run test:browser
      - name: Split data files into Cloudflare asset parts
        run: python3 deploy/split-data.py --site .tools/release-web --output .tools/site --manifest deploy/data-parts.json
      - name: Test that return visits start from the game data kept in the browser
        run: UQM_DATA_CACHE_LEAN=1 UQM_DIST=.tools/release-web UQM_SITE=.tools/site UQM_SITE_MANIFEST=deploy/data-parts.json UQM_TEST_OUTPUT=test-results/data-cache npm run test:data-cache
      - name: Test Cosmo Clash and its Online Melee through the Worker, its asset store and its relay
        run: UQM_SITE=.tools/site UQM_SITE_MANIFEST=deploy/data-parts.json UQM_TEST_OUTPUT=test-results/cosmoclash-worker npm run test:cosmoclash-site
      - name: Deploy the Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.1 deploy --config deploy/wrangler.jsonc --message "${GITHUB_SHA::9}"
      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://urquanmasters.org/ && break
            sleep 20
          done
          curl -fsSI https://urquanmasters.org/original/index.html | tee headers.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
          for folder in original hd original-rust hd-rust; do
            curl -fsSI "https://urquanmasters.org/$folder/uqm-debug.wasm" | grep -qi '^content-type: application/wasm'
            want="$(sha256sum .tools/release-web/$folder/uqm-debug.wasm | cut -d' ' -f1)"
            got="$(curl -fsS "https://urquanmasters.org/$folder/uqm-debug.wasm" | sha256sum | cut -d' ' -f1)"
            echo "$folder wasm: $got"
            test "$got" = "$want"
            expected="$(python3 -c "import json,sys; print(json.load(open('deploy/data-parts.json'))['/' + sys.argv[1] + '/uqm-debug.data']['sha256'])" "$folder")"
            actual="$(curl -fsS "https://urquanmasters.org/$folder/uqm-debug.data" | sha256sum | cut -d' ' -f1)"
            echo "$folder data: $actual"
            test "$actual" = "$expected"
          done
          # Every shell reads UQM_VARIANT; only the Rust pages get the assignment (package-editions.py).
          curl -fsS https://urquanmasters.org/original-rust/index.html | grep -q 'window.UQM_VARIANT = '
          curl -fsS https://urquanmasters.org/hd-rust/index.html | grep -q 'window.UQM_VARIANT = '
          ! curl -fsS https://urquanmasters.org/original/index.html | grep -q 'window.UQM_VARIANT = '
          ! curl -fsS https://urquanmasters.org/hd/index.html | grep -q 'window.UQM_VARIANT = '
      - name: Check the live Cosmo Clash files and headers
        run: |
          site=.tools/release-web
          curl -fsS https://urquanmasters.org/ | grep -q 'id="edition-cosmoclash"'
          # /cosmoclash opens /cosmoclash/ and keeps the invitation query.
          curl -sS -o /dev/null -D redirect.txt 'https://urquanmasters.org/cosmoclash?cosmoRoom=0123456789abcdef0123456789abcdef'
          cat redirect.txt
          grep -qE '^HTTP/[0-9.]+ 301' redirect.txt
          grep -qi '^location: https://urquanmasters.org/cosmoclash/?cosmoRoom=0123456789abcdef0123456789abcdef' redirect.txt
          # The page: the deployed bytes, HTML, checked again on each visit, cross-origin isolated.
          curl -fsS -D page.txt -o page.html https://urquanmasters.org/cosmoclash/
          cat page.txt
          cmp page.html "$site/cosmoclash/index.html"
          grep -qi '^content-type: text/html; charset=utf-8' page.txt
          grep -qi '^cache-control: no-cache' page.txt
          grep -qi '^cross-origin-opener-policy: same-origin' page.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' page.txt
          grep -qi '^cross-origin-resource-policy: same-origin' page.txt
          # Every script and style of the page: the deployed bytes, immutable (Vite hashed names).
          for asset in $(grep -oE '/cosmoclash/assets/[^"]+\.(js|css)' "$site/cosmoclash/index.html" | sort -u); do
            curl -fsS -D asset.txt -o asset.bin "https://urquanmasters.org$asset"
            cmp asset.bin "$site$asset"
            grep -qiE '^content-type: text/(javascript|css); charset=utf-8' asset.txt
            grep -qi '^cache-control: public, max-age=31536000, immutable' asset.txt
            echo "$asset: same bytes, immutable"
          done
          # The gameplay Wasm: both online players must load the same one, so it is checked again on each visit.
          curl -fsS -D wasm.txt -o cosmoclash.wasm https://urquanmasters.org/cosmoclash/cosmoclash.wasm
          cmp cosmoclash.wasm "$site/cosmoclash/cosmoclash.wasm"
          grep -qi '^content-type: application/wasm' wasm.txt
          grep -qi '^cache-control: no-cache' wasm.txt
          echo "cosmoclash wasm: $(sha256sum cosmoclash.wasm | cut -d' ' -f1)"
          for file in models/gondi.glb sounds/Damage.ogg sounds/bigang.wav textures/heart.png textures/main-bk.jpg; do
            type="$(curl -fsS -o /dev/null -w '%{content_type}' "https://urquanmasters.org/cosmoclash/$file")"
            echo "$file: $type"
            case "$file" in
              *.glb) test "$type" = model/gltf-binary ;;
              *.ogg) test "$type" = audio/ogg ;;
              *.wav) test "$type" = audio/wav ;;
              *.png) test "$type" = image/png ;;
              *.jpg) test "$type" = image/jpeg ;;
            esac
          done
      - name: Open the live picker card and Cosmo Clash in a real browser
        run: UQM_ORIGIN=https://urquanmasters.org UQM_DIST=.tools/release-web UQM_TEST_OUTPUT=test-results/cosmoclash-live npm run test:cosmoclash-site
      - name: Check the live Online Melee relay
        run: |
          # A private room of the Original namespace and one of Cosmo Clash.
          for namespace in '' cosmoclash/; do
            NAMESPACE="$namespace" node --input-type=module -e "
              import { WebSocket } from 'ws';
              import { randomBytes } from 'node:crypto';
              const ws = new WebSocket('wss://urquanmasters.org/netplay/' + process.env.NAMESPACE + randomBytes(16).toString('hex') + '?role=host',
                { origin: 'https://urquanmasters.org' });
              const timer = setTimeout(() => { console.error('No relay answer'); process.exit(1); }, 15000);
              ws.on('error', error => { console.error(error.message); process.exit(1); });
              ws.on('message', data => {
                console.log('relay /netplay/' + process.env.NAMESPACE + ':', data.toString());
                clearTimeout(timer);
                ws.close();
                process.exit(JSON.parse(data).type === 'waiting' ? 0 : 1);
              });
            "
          done
      - name: Check the live room lists
        run: |
          for edition in original hd cosmoclash; do
            EDITION="$edition" node --input-type=module -e "
              import { WebSocket } from 'ws';
              const ws = new WebSocket('wss://urquanmasters.org/netplay/lobby?edition=' + process.env.EDITION,
                { origin: 'https://urquanmasters.org' });
              const timer = setTimeout(() => { console.error('No room list answer'); process.exit(1); }, 15000);
              ws.on('error', error => { console.error(error.message); process.exit(1); });
              ws.on('message', data => {
                const message = JSON.parse(data);
                console.log(process.env.EDITION, 'room list:', message.type, Array.isArray(message.rooms) ? message.rooms.length : '?');
                clearTimeout(timer);
                ws.close();
                process.exit(message.type === 'rooms' && Array.isArray(message.rooms) ? 0 : 1);
              });
            "
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
