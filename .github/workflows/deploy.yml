name: Deploy to Cloudflare

on:
  push:
    branches: [deploy/cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Test browser helpers and real WebSocket relay
        run: npm test
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Build both editions into a clean release package
        env:
          JOBS: '4'
        run: BUILD_OUTPUT="$PWD/.tools/release-web" ./scripts/build-editions.sh
      - name: Run actual-source Wasm transport and disconnect regressions
        run: bash sc2/src/uqm/supermelee/netplay/tests/run.sh
      - name: Test the edition picker with both real engines
        run: |
          npx playwright install --with-deps chromium
          UQM_DIST=.tools/release-web npm run test:editions
      - name: Split data files into Cloudflare asset parts
        run: python3 deploy/split-data.py --site .tools/release-web --output .tools/site --manifest deploy/data-parts.json
      - name: Deploy the Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.1 deploy --config deploy/wrangler.jsonc --message "${GITHUB_SHA::9}"
      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://urquanmasters.org/ && break
            sleep 20
          done
          curl -fsSI https://urquanmasters.org/original/index.html | tee headers.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
          curl -fsSI https://urquanmasters.org/original/uqm-debug.wasm | grep -qi '^content-type: application/wasm'
          for edition in original hd; do
            expected="$(python3 -c "import json,sys; print(json.load(open('deploy/data-parts.json'))['/' + sys.argv[1] + '/uqm-debug.data']['sha256'])" "$edition")"
            actual="$(curl -fsS "https://urquanmasters.org/$edition/uqm-debug.data" | sha256sum | cut -d' ' -f1)"
            echo "$edition data: $actual"
            test "$actual" = "$expected"
          done
