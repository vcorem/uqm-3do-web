name: Cosmo Clash Rust and netplay
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'cosmoclash/**'
      - 'rust/uqm-relay/**'
      - 'rust/Cargo.*'
      - 'rust-toolchain.toml'
      - 'server/netplay.mjs'
      - 'deploy/**'
      - 'web/editions/**'
      - 'scripts/package-editions.py'
      - 'scripts/build-editions.sh'
      - 'tests/server/**'
      - 'tests/worker/**'
      - 'tests/web/editions.test.cjs'
      - 'tests/web/package-editions.test.cjs'
      - 'tests/browser/cosmoclash-site.mjs'
      - 'tests/helpers/**'
      - 'scripts/*rust*.sh'
      - 'package*.json'
      - '.github/workflows/cosmoclash.yml'
  pull_request:
    paths:
      - 'cosmoclash/**'
      - 'rust/uqm-relay/**'
      - 'rust/Cargo.*'
      - 'rust-toolchain.toml'
      - 'server/netplay.mjs'
      - 'deploy/**'
      - 'web/editions/**'
      - 'scripts/package-editions.py'
      - 'scripts/build-editions.sh'
      - 'tests/server/**'
      - 'tests/worker/**'
      - 'tests/web/editions.test.cjs'
      - 'tests/web/package-editions.test.cjs'
      - 'tests/browser/cosmoclash-site.mjs'
      - 'tests/helpers/**'
      - 'scripts/*rust*.sh'
      - 'package*.json'
      - '.github/workflows/cosmoclash.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmoclash-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cosmoclash/package-lock.json
      - name: Install locked dependencies and Rust target
        run: |
          npm ci
          npm ci --prefix cosmoclash
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Build and test the Rust gameplay engine
        run: |
          cargo fmt --manifest-path cosmoclash/rust/Cargo.toml --all -- --check
          cargo test --manifest-path cosmoclash/rust/Cargo.toml --locked
          cargo build --manifest-path cosmoclash/rust/Cargo.toml --bin cosmo-jsonl --locked
          cargo clippy --manifest-path cosmoclash/rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compare gameplay and AI with the TypeScript source
        run: |
          npm run test:provenance --prefix cosmoclash
          npm test --prefix cosmoclash
      - name: Build production browser game and verify Wasm against native Rust
        run: |
          npm run build --prefix cosmoclash
          node cosmoclash/tests/wasm.mjs
      - name: Verify existing UQM and new Cosmo Clash relay behavior
        run: npm test
      - name: Test the Cloudflare relay (Cosmo Clash rooms and room list) and site under wrangler dev
        timeout-minutes: 12
        run: npm run test:worker
      - name: Test actual two-browser combat, fleets, rematches and disconnects
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser --prefix cosmoclash
      # The site build: urquanmasters.org/cosmoclash/ behind the picker, with stand-in UQM pages.
      - name: Test the Cosmo Clash card and game at /cosmoclash/
        run: |
          (cd cosmoclash && npx vite build --base /cosmoclash/ --outDir ../.tools/cosmoclash-site-dist --emptyOutDir)
          python3 scripts/package-editions.py --check-cosmoclash .tools/cosmoclash-site-dist
          COSMO_DIST=.tools/cosmoclash-site-dist UQM_TEST_OUTPUT=test-results/cosmoclash-site npm run test:cosmoclash-site
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmoclash-test-results
          path: |
            test-results
            cosmoclash/test-results
          retention-days: 7
          if-no-files-found: ignore
