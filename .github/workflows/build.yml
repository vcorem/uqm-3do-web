name: Build and test

on:
  push:
    branches: [main, proposed, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "38 16 * * TUE"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Test browser helpers and real WebSocket relay
        run: npm test
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Build the complete browser game
        env:
          JOBS: '4'
        run: ./scripts/build-web.sh
      - name: Run actual-source Wasm transport and disconnect regressions
        run: bash sc2/src/uqm/supermelee/netplay/tests/run.sh
      - name: Install Chromium for game integration tests
        run: npx playwright install --with-deps chromium
      - name: Test real two-browser matches and disconnects
        run: npm run test:browser
      - name: Build pinned redrawn HD engine and verify official media
        env:
          JOBS: '4'
        run: ./scripts/build-hd-web.sh
      - name: Test real HD campaign loading and travel to Hyperspace
        run: UQM_DIST=.tools/hd-dist npm run test:hd-campaign
      - name: Test HD idle stability and actual local combat
        run: UQM_DIST=.tools/hd-dist npm run test:hd-stability
      - name: Package and test the edition picker with both real engines
        run: |
          python3 scripts/package-editions.py --original dist --hd .tools/hd-dist --output .tools/editions-dist
          UQM_DIST=.tools/editions-dist npm run test:editions
      - name: Check the browser package and script syntax
        run: |
          for artifact in index.html uqm-debug.js uqm-debug.wasm uqm-debug.data uqm-debug.worker.js netplay-client.js game-help.js COPYING.txt toolchain-fixes.json; do
            test -s "dist/$artifact"
          done
          bash -n scripts/build-web.sh scripts/build-hd-web.sh scripts/build-editions.sh
          python3 -m py_compile scripts/serve.py scripts/fetch-hd-content.py scripts/package-editions.py scripts/prepare-emscripten-proxy.py
          git diff --check
