name: Build and test

on:
  push:
    branches: [main, proposed, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "38 16 * * TUE"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install the pinned Rust toolchain and build the relay
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-emscripten
          rustup toolchain install "$(cat .rust-wasm-toolchain)" --profile minimal --component rust-src --target wasm32-unknown-emscripten
          cargo build --manifest-path rust/Cargo.toml -p uqm-relay --release --locked
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features --locked
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test browser helpers and real WebSocket relay
        run: npm test
      - name: Check reproducible Rust translation helpers
        run: python3 scripts/rust-engine/test_tools.py
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Restore the Rust engine build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            .tools/rust-engine-original
          key: rust-engine-original-${{ hashFiles('.rust-wasm-toolchain', 'rust/uqm-engine-original/**', 'rust/uqm-core/**', 'rust/uqm-png/**', 'rust/uqm-lua/**', 'scripts/rust-engine/**') }}
          restore-keys: rust-engine-original-
      - name: Build the complete browser game
        env:
          JOBS: '4'
        run: ./scripts/build-web.sh
      - name: Compare Rust core, movement and geometry with actual C implementations
        run: |
          bash scripts/test-rust-core.sh --all
          bash tests/rust/test-velocity.sh --all
          bash tests/rust/test-queue-geometry.sh --all
          bash tests/rust/test-bbox.sh --all
      - name: Run actual-source Wasm transport and disconnect regressions
        run: bash sc2/src/uqm/supermelee/netplay/tests/run.sh
      - name: Verify complete Original Rust exports and allocator alignment
        run: |
          python3 scripts/rust-engine/check-exports.py original .tools/rust-engine-original/wasm32-unknown-emscripten/release/libuqm_engine_original.a
          bash tests/rust/test-allocator.sh
      - name: Install Chromium for game integration tests
        run: npx playwright install --with-deps chromium
      - name: Test real two-browser matches and disconnects
        run: UQM_RELAY=rust npm run test:browser
      - name: Test voiced dialogue and subtitle pixels in the Rust engine
        run: npm run test:subtitles
      - name: Test the start screen and online lobby in the game frame
        run: |
          for artifact in online-ui.js online-art.json online-art.png online-stars.png online-title.png; do test -s "dist/$artifact"; done
          python3 -m py_compile web/online/build-art.py
          UQM_EDITIONS=original npm run test:online-ui
      - name: Compare C and Rust clients in real battles through the Rust relay
        run: |
          UQM_CORE=c BUILD_OUTPUT="$PWD/.tools/c-reference" ./scripts/build-web.sh
          UQM_RELAY=rust UQM_PEER_DIST=.tools/c-reference UQM_TEST_OUTPUT=test-results/rust-c npm run test:browser
      - name: Compare ship movement, weapons and specials with the C client
        run: UQM_RELAY=rust UQM_PEER_DIST=.tools/c-reference UQM_SHIP_SMOKE=0,3,11,18,19,21,22,23 UQM_TEST_OUTPUT=test-results/rust-ships npm run test:browser
      - name: Start two online sessions from the main menu, C host and Rust guest
        run: UQM_RELAY=rust UQM_DIST=.tools/c-reference UQM_PEER_DIST=dist UQM_TEST_OUTPUT=test-results/hook-c-rust npm run test:netplay-hook
      - name: Check the browser package and script syntax
        run: |
          for artifact in index.html uqm-debug.js uqm-debug.wasm uqm-debug.data uqm-debug.worker.js netplay-client.js game-help.js engine-loader.js COPYING.txt toolchain-fixes.json; do
            test -s "dist/$artifact"
          done
          bash -n scripts/build-web.sh scripts/build-hd-web.sh scripts/build-editions.sh scripts/build-rust-core.sh scripts/build-rust-relay.sh scripts/run-rust-relay.sh scripts/rust-env.sh scripts/test-rust-core.sh scripts/rust-engine/build.sh tests/rust/test-velocity.sh tests/rust/test-queue-geometry.sh tests/rust/test-bbox.sh tests/rust/test-png.sh tests/rust/test-lua.sh tests/rust/test-allocator.sh
          python3 -m py_compile scripts/serve.py scripts/fetch-hd-content.py scripts/package-editions.py scripts/apply-hd-patches.py scripts/prepare-emscripten-proxy.py scripts/rust-engine/*.py
          git diff --check

  hd:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install the pinned Rust toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-emscripten
          rustup toolchain install "$(cat .rust-wasm-toolchain)" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Install pinned Emscripten SDK
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Restore the Rust engine build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            .tools/rust-engine-hd
          key: rust-engine-hd-${{ hashFiles('.rust-wasm-toolchain', 'rust/uqm-engine-hd/**', 'rust/uqm-core/**', 'rust/uqm-png/**', 'rust/uqm-lua/**', 'scripts/rust-engine/**') }}
          restore-keys: rust-engine-hd-
      - name: Build pinned redrawn HD engine and verify official media
        env:
          JOBS: '4'
        run: ./scripts/build-hd-web.sh
      - name: Verify repeatable HD patch upgrades
        run: python3 tests/tools/test_apply_hd_patches.py --upstream .tools/hd-source -v
      - name: Compare HD C and Rust packet handling and browser transport
        run: bash tests/rust/test-hd-netplay.sh --all
      - name: Install Chromium for game integration tests
        run: npx playwright install --with-deps chromium
      - name: Test HD Rust multiplayer matches and disconnects
        run: UQM_RELAY=rust UQM_EDITION=hd UQM_DIST=.tools/hd-dist UQM_TEST_OUTPUT=test-results/hd-rust-rust npm run test:browser
      - name: Test the HD start screen and online lobby in the game frame
        run: UQM_EDITIONS=hd npm run test:online-ui
      - name: Compare HD C and Rust clients through the Rust relay
        run: |
          UQM_CORE=c HD_OFFLINE=1 HD_BUILD_OUTPUT="$PWD/.tools/hd-c-reference" ./scripts/build-hd-web.sh
          UQM_RELAY=rust UQM_EDITION=hd UQM_DIST=.tools/hd-dist UQM_PEER_DIST=.tools/hd-c-reference UQM_TEST_OUTPUT=test-results/hd-rust-c npm run test:browser
      - name: Compare HD ship movement, weapons and specials with the C client
        run: UQM_RELAY=rust UQM_EDITION=hd UQM_DIST=.tools/hd-dist UQM_PEER_DIST=.tools/hd-c-reference UQM_SHIP_SMOKE=0,3,11,18,19,21,22,23 UQM_TEST_OUTPUT=test-results/hd-rust-ships npm run test:browser
      - name: Start two HD online sessions from the main menu, C host and Rust guest
        run: UQM_RELAY=rust UQM_EDITION=hd UQM_DIST=.tools/hd-c-reference UQM_PEER_DIST=.tools/hd-dist UQM_TEST_OUTPUT=test-results/hd-hook-c-rust npm run test:netplay-hook
      - name: Compare HD Rust core, movement and geometry with pinned MegaMod C
        run: |
          python3 scripts/rust-engine/check-exports.py hd .tools/rust-engine-hd/wasm32-unknown-emscripten/release/libuqm_engine_hd.a
          bash scripts/test-rust-core.sh --all --hd
          bash tests/rust/test-velocity.sh --all --hd
          bash tests/rust/test-queue-geometry.sh --all --hd
          bash tests/rust/test-bbox.sh --all --hd
      - name: Compare Rust PNG decoding and writing with both original implementations
        run: bash tests/rust/test-png.sh --wasm
      - name: Verify Lua failures return normally through Rust callbacks
        run: |
          bash tests/rust/test-lua.sh --wasm
          python3 scripts/rust-engine/test_lua_propagate.py .tools/rust-lua-transform-target/release/uqm-lua-propagate
      - name: Compare solar draw ordering, including the sun and maximum planet count
        run: python3 tests/rust/test-solar-sort.py
      - name: Test real HD campaign loading and travel to Hyperspace
        run: |
          node tests/browser/scene-pixels.test.mjs
          UQM_DIST=.tools/hd-dist npm run test:hd-campaign
      - name: Test HD idle stability and actual local combat
        run: UQM_DIST=.tools/hd-dist npm run test:hd-stability
