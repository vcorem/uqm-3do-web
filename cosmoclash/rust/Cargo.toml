[package]
name = "cosmoclash-core"
version = "0.1.0"
edition = "2021"
license = "ISC"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
