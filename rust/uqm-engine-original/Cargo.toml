[workspace]
members = [
]
[package]
name = "uqm-engine-original"
authors = ["The Ur-Quan Masters contributors"]
license = "GPL-2.0-only"
version = "0.1.0"
publish = false
edition = "2021"
autobins = false

[lib]
name = "uqm_engine_original"
path = "lib.rs"
crate-type = ["staticlib", "rlib"]
[dependencies]
uqm-core = { path = "../uqm-core" }
c2rust-bitfields = { version = "=0.22.1", features = ["no_std"] }


[profile.release]
panic = "abort"
strip = "debuginfo"
[profile.dev]
panic = "abort"
