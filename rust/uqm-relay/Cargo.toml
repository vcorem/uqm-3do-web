[package]
name = "uqm-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "GPL-2.0-or-later"
description = "Bounded private two-player relay and static host for UQM Web"

[dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.140"
sha1 = "=0.10.6"
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
url = "=2.4.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
